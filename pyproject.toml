[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-atlas"
version = "0.1.0"
description = "An inspectable, bounded retrieval-recovery assistant for backend incidents"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.6,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
  "httpx>=0.27,<1", "langgraph>=0.2,<2", "pypdf>=5,<7",
  "python-multipart>=0.0.18,<1", "python-dotenv>=1,<2"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
dev = ["ruff==0.17.4"]
ui = ["playwright==1.64.1"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.packages.find]
include = ["incident_atlas*"]

[tool.setuptools.package-data]
incident_atlas = ["static/*", "demo/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
